<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Clearance System - Home</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Market Clearance System</div>
    <ul class="nav-links">
      <li><a href="menu.html">Home</a></li>
      <li><a href="application.html">Application</a></li>
      <li><a href="renewal.html">Renewal</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <section class="home">
    <h1>Welcome to the Market Clearance System</h1>
    <p>Manage your applications and renewals with ease.</p>

    <div class="video-container">
      <video controls autoplay muted loop>
        <source src="assets/videos/market_ad.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <script>
    // Highlight active page in navbar
    document.addEventListener("DOMContentLoaded", () => {
      const links = document.querySelectorAll(".nav-links a");
      const currentPage = window.location.pathname.split("/").pop();

      links.forEach(link => {
        if (link.getAttribute("href") === currentPage) {
          link.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
