<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form | Ludiflex</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-blob">
                <img src="assets/images/blob.svg" alt="Blob" class="blob-image blob-image--1">
                <img src="assets/images/blob.svg" alt="Blob" class="blob-image blob-image--2">
                <img src="assets/images/blob.svg" alt="Blob" class="blob-image blob-image--3">
            </div>

            <!-- ✅ ADDED LOGO -->
            <div class="form-logo">
                <h2>MCS</h2>
            </div>

            <div class="form-header">
                <p>Please enter your details</p>
                <h1>Welcome to Market Clearance System</h1>
            </div>

            <!-- LOGIN FORM -->
            <form class="form-box" onsubmit="loginUser(event)">
                <div class="input-group">
                    <input type="email" id="email" class="input-field" required>
                    <label for="email" class="floating-label">Email address</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="input-field" required>
                    <label for="password" class="floating-label">Password</label>
                    <div class="eye-icon" onclick="togglePassword()"></div>
                </div>

                <div class="input-group checkbox-group">
                    <div class="form-col remember-me">
                        <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                        <label for="remember-me-checkbox">Remember me</label>
                    </div>
                    <div class="form-col">
                        <a href="#" class="form-link">Forgot password?</a>
                    </div>
                </div>

                <!-- ✅ SIGN IN BUTTON -->
                <button type="submit" class="form-btn form-btn--submit">Sign In</button>
            </form>
            <!-- END LOGIN FORM -->

            <div class="form-divider">
                <p>Or</p>
            </div>
            <div class="form-bottom">
                <div class="form-socials">
                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/google.svg" class="btn-icon" alt="">
                    </button>
                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/facebook.svg" class="btn-icon" alt="">
                    </button>
                    <button type="button" class="form-btn form-btn--social">
                        <img src="assets/images/apple.svg" class="btn-icon" alt="">
                    </button>
                </div>
                <p>Don't have an account? <a href="#" class="form-link">Sign up</a></p>
            </div>
        </div>
    </div>
    

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.querySelector(".eye-icon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.innerHTML = `<svg ...>...</svg>`; // eye-off icon
        } else {
            passwordInput.type = "password";
            eyeIcon.innerHTML = `<svg ...>...</svg>`; // eye icon
        }
      }

      function loginUser(event) {
        event.preventDefault(); // stop refresh
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email && password) {
          // ✅ Redirect to menu page
          window.location.href = "menu.html";
        } else {
          alert("Please enter email and password");
        }
      }
    </script>

</body>
</html>
